<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve Design | Identidade Visual, IA Criativa & Ecossistemas Digitais</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="64x64" href="https://i.imgur.com/bm07Eug.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/bm07Eug.png">
    
    <!-- Meta tags Open Graph -->
    <meta property="og:title" content="Eve Design | Identidade Visual, IA Criativa & Ecossistemas Digitais">
    <meta property="og:description" content="Desenvolvo identidades visuais, design de posts, sites, sistemas de estudos, cenários e personagens gerados por IA, vídeos profissionais pelo CapCut para qualquer formato e criativos de anúncios.">
    <meta property="og:image" content="https://i.imgur.com/RLBQIdy.png">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bordo: '#6E1940',
                        rosa: '#F384B2',
                        rosaclaro: '#F0C4D7',
                        amarelo: '#F7C815',
                        creme: '#F7E9D6',
                    },
                    fontFamily: {
                        sans: ['Darker Grotesque', 'Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #F7E9D6; color: #6E1940; font-family: 'Darker Grotesque', sans-serif; font-size: 1.15rem; line-height: 1.25; }
        .bg-pattern { background-image: radial-gradient(#F0C4D7 1.2px, transparent 1.2px); background-size: 24px 24px; }
        .card-feedback { animation: pulse 0.4s ease-in-out; background-color: #F0C4D7 !important; }
        .toast-transition { transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #6E1940; outline-offset: 2px; }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-rosa selection:text-bordo">

    <!-- TOAST -->
    <div id="toast-feedback" class="fixed top-5 right-5 bg-bordo text-creme px-5 py-3 rounded-2xl shadow-2xl z-50 hidden opacity-0 toast-transition border-2 border-rosa flex items-center gap-2 font-black text-sm">
        <span id="toast-icon">✨</span> <span id="toast-msg">Item adicionado!</span>
    </div>

    <!-- HEADER -->
    <header class="w-full bg-white/95 backdrop-blur-md border-b-2 border-rosaclaro sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <a href="#sobre-mim" class="flex items-center gap-3 group rounded-xl p-1 transition-all">
                <div class="relative">
                    <img src="https://i.imgur.com/DXgf8v3.png" alt="Evelyn Cecilia" class="w-12 h-12 rounded-full object-cover border-2 border-rosa shadow-sm">
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-black text-base leading-none">Evelyn Cecilia</h2>
                    <p class="text-xs font-bold">Eve Design Studio</p>
                </div>
            </a>
            <a href="https://wa.me/5511999999999" target="_blank" class="bg-bordo text-creme hover:bg-rosa hover:text-bordo font-black text-sm py-2 px-4 rounded-xl transition-all">WhatsApp</a>
        </div>
    </header>

    <!-- BANNER -->
    <section class="max-w-6xl mx-auto px-4 pt-6">
        <img src="https://i.imgur.com/dXVvX40.png" class="w-full rounded-3xl border-2 border-rosa shadow-lg">
    </section>

    <!-- SEÇÃO SOBRE MIM -->
    <section id="sobre-mim" class="max-w-6xl mx-auto p-4 py-8">
        <div class="bg-white/90 border-2 border-rosaclaro rounded-3xl p-8 flex flex-col md:flex-row items-center gap-8">
            <img src="https://i.imgur.com/GT41Uku.png" class="w-48 h-48 rounded-2xl border-2 border-rosa shadow-md">
            <div>
                <h2 class="text-3xl font-black mb-2">Designer Gráfica & Especialista em IA</h2>
                <p class="font-bold">Crio ecossistemas digitais, animações e estratégias visuais completas.</p>
            </div>
        </div>
    </section>

    <!-- CALCULADORA DE PROJETOS -->
    <section id="simulador" class="max-w-6xl mx-auto p-4 py-8">
        <div class="bg-white border-2 border-rosa rounded-3xl p-8 shadow-xl">
            <h2 class="text-3xl font-black mb-6">Calculadora de Projetos</h2>
            
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Lista de Serviços -->
                <div class="space-y-4">
                    <div class="p-4 border-2 border-rosaclaro rounded-xl flex justify-between">
                        <span>Edição Geral (R$ 50/min)</span>
                        <input type="checkbox" id="check-video-geral" class="calc-item w-5 h-5" onchange="calcularTotal()">
                    </div>
                    <input type="number" id="input-minutos" value="1" min="1" class="w-full p-2 border rounded-lg" onchange="calcularTotal()" placeholder="Minutos">
                    
                    <div class="p-4 border-2 border-rosaclaro rounded-xl flex justify-between">
                        <span>Vídeos IA</span>
                        <input type="checkbox" class="calc-item w-5 h-5" data-price="250" data-name="Vídeos IA" onchange="calcularTotal()">
                    </div>
                </div>

                <!-- Total -->
                <div class="bg-bordo text-creme p-6 rounded-2xl">
                    <div id="total-valor" class="text-5xl font-black">R$ 0,00</div>
                    <button onclick="abrirModalOrcamento()" class="mt-4 w-full bg-rosa text-bordo py-3 rounded-xl font-black">Finalizar Orçamento</button>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAIS E SCRIPTS FICAM AQUI (Mantidos) -->
    <script>
        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('.calc-item:checked').forEach(i => total += parseFloat(i.dataset.price));
            if(document.getElementById('check-video-geral').checked) {
                total += (parseInt(document.getElementById('input-minutos').value) || 0) * 50;
            }
            document.getElementById('total-valor').innerText = 'R$ ' + total.toFixed(2).replace('.', ',');
        }
        function abrirModalOrcamento() { alert('Enviando para seu e-mail...'); }
    </script>
</body>
</html>
