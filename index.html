<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzXhkvwxpUBB1A2cfC90JUEOY9zyPF-du1gh5vB0v-9A8V9o9H-EcQtMoNY1vdsIBnNiA/exec";
    const SEU_INSTAGRAM = "eve.desi_gn"; 

    function mostrarToast(mensagem, icone = "✨") {
        const toast = document.getElementById('toast-feedback');
        document.getElementById('toast-msg').innerText = mensagem;
        document.getElementById('toast-icon').innerText = icone;
        
        toast.classList.remove('hidden', 'opacity-0');
        toast.classList.add('opacity-100');

        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, 3000);
    }

    function abrirModalFeedback() {
        document.getElementById('modalFeedback').classList.remove('hidden');
        document.getElementById('modalFeedback').classList.add('flex');
    }

    function fecharModalFeedback() {
        document.getElementById('modalFeedback').classList.add('hidden');
        document.getElementById('modalFeedback').classList.remove('flex');
    }

    function enviarFeedbackPlanilha(e) {
        e.preventDefault();
        const nomeVal = document.getElementById('fb-nome').value.trim();
        const estrelasVal = document.getElementById('fb-estrelas').value;
        const comentarioVal = document.getElementById('fb-comentario').value.trim();

        const payload = {
            tipo: "feedback",
            nome: nomeVal,
            estrelas: estrelasVal,
            comentario: comentarioVal
        };

        if (URL_APPS_SCRIPT) {
            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('Erro feedback:', err));
        }

        mostrarToast("Feedback enviado com sucesso! ⭐✨", "💖");
        fecharModalFeedback();
        document.getElementById('formFeedback').reset();
    }

    function selecionarServicoPorTabela(nomeServico) {
        const items = document.querySelectorAll('.calc-item');
        let itemEncontrado = null;
        
        items.forEach(item => {
            if(item.getAttribute('data-name') === nomeServico) {
                item.checked = true;
                itemEncontrado = item;
            }
        });

        if (itemEncontrado) {
            const labelParent = itemEncontrado.closest('label');
            if (labelParent) {
                labelParent.classList.add('card-feedback');
                setTimeout(() => labelParent.classList.remove('card-feedback'), 600);
            }
        }

        calcularTotal();
        mostrarToast(`"${nomeServico}" adicionado ao carrinho!`, "🛒");
        document.getElementById('simulador').scrollIntoView({ behavior: 'smooth' });
    }

    function destacarOpcaoCalculadora(idCheckbox) {
        const checkbox = document.getElementById(idCheckbox);
        if (checkbox) {
            checkbox.checked = !checkbox.checked; // Alterna entre marcar/desmarcar
            if(idCheckbox === 'check-video-ia') toggleIaMinutos();
            if(idCheckbox === 'check-video-geral') toggleVideoGeral();
            
            const wrapper = document.getElementById('wrapper-' + idCheckbox.replace('check-', ''));
            if (wrapper) {
                wrapper.classList.add('card-feedback');
                setTimeout(() => wrapper.classList.remove('card-feedback'), 600);
            }
        }
        calcularTotal();
        const statusMsg = checkbox.checked ? "Item adicionado ao carrinho!" : "Item removido do carrinho";
        const iconeMsg = checkbox.checked ? "🛒" : "🗑️";
        mostrarToast(statusMsg, iconeMsg);
        document.getElementById('simulador').scrollIntoView({ behavior: 'smooth' });
    }

    function removerItemCarrinho(nomeServico) {
        const items = document.querySelectorAll('.calc-item');
        items.forEach(item => {
            if(item.getAttribute('data-name') === nomeServico) {
                item.checked = false;
            }
        });
        if(nomeServico.includes('Vídeos com IA')) {
            document.getElementById('check-video-ia').checked = false;
            toggleIaMinutos();
        }
        if(nomeServico.includes('Edição Geral')) {
            document.getElementById('check-video-geral').checked = false;
            toggleVideoGeral();
        }
        calcularTotal();
        mostrarToast("Item removido do carrinho", "🗑️");
    }

    function toggleVideoGeral() {
        const isChecked = document.getElementById('check-video-geral').checked;
        const box = document.getElementById('box-minutos-geral');
        box.classList.toggle('hidden', !isChecked);
        box.classList.toggle('flex', isChecked);
    }

    function mudarMinutosGeral(qtd) {
        const input = document.getElementById('input-minutos-geral');
        let valor = parseInt(input.value) + qtd;
        if(valor < 1) valor = 1;
        input.value = valor;
        calcularTotal();
    }

    function toggleIaMinutos() {
        const isChecked = document.getElementById('check-video-ia').checked;
        const box = document.getElementById('box-minutos-ia');
        box.classList.toggle('hidden', !isChecked);
        box.classList.toggle('flex', isChecked);
    }

    function mudarIaMinutos(qtd) {
        const input = document.getElementById('input-minutos-ia');
        let valor = parseInt(input.value) + qtd;
        if(valor < 1) valor = 1;
        input.value = valor;
        calcularTotal();
    }

    function limparCalculadora() {
        document.querySelectorAll('.calc-item').forEach(item => item.checked = false);
        
        document.getElementById('check-video-geral').checked = false;
        document.getElementById('box-minutos-geral').classList.add('hidden');
        document.getElementById('input-minutos-geral').value = 1;

        document.getElementById('check-video-ia').checked = false;
        document.getElementById('box-minutos-ia').classList.add('hidden');
        document.getElementById('input-minutos-ia').value = 1;
        
        calcularTotal();
        mostrarToast("Carrinho esvaziado!", "🔄");
    }

    function obterItensSelecionadosTexto() {
        let lista = [];

        document.querySelectorAll('.calc-item').forEach(item => {
            if(item.checked) {
                lista.push(item.getAttribute('data-name'));
            }
        });

        const checkIa = document.getElementById('check-video-ia');
        if(checkIa.checked) {
            const minIa = document.getElementById('input-minutos-ia').value || 1;
            lista.push(`Vídeos com IA + CapCut (${minIa} min)`);
        }

        const checkGeral = document.getElementById('check-video-geral');
        if(checkGeral.checked) {
            const minGeral = document.getElementById('input-minutos-geral').value || 1;
            lista.push(`Edição Geral de Vídeos (${minGeral} min)`);
        }

        return lista;
    }

    function calcularTotal() {
        let total = 0;
        const resumoUl = document.getElementById('resumo-entregas');
        resumoUl.innerHTML = '';
        let selecionados = 0;

        // Calcula itens normais da calculadora e exibe notificação ao marcar caixas diretamente
        document.querySelectorAll('.calc-item').forEach(item => {
            if(item.checked) {
                const preco = parseFloat(item.getAttribute('data-price'));
                total += preco;
                selecionados++;
                const nomeServico = item.getAttribute('data-name');
                
                const li = document.createElement('li');
                li.className = "pt-2 pb-1 flex justify-between items-center";
                li.innerHTML = `<div><strong class="text-bordo">${nomeServico}</strong><br><span class="text-xs text-bordo font-bold">${item.getAttribute('data-summary')}</span></div><div class="flex items-center gap-3"><span class="font-black text-bordo text-sm sm:text-base shrink-0">R$ ${preco.toFixed(2).replace('.', ',')}</span><button type="button" onclick="removerItemCarrinho('${nomeServico}')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-100 px-2 py-1 rounded-lg">Remover</button></div>`;
                resumoUl.appendChild(li);
            }
        });

        // Vídeos com IA por Minutagem
        const checkVideoIa = document.getElementById('check-video-ia');
        if(checkVideoIa.checked) {
            const minutosIa = parseInt(document.getElementById('input-minutos-ia').value) || 1;
            const precoIa = minutosIa * 80;
            total += precoIa;
            selecionados++;

            const li = document.createElement('li');
            li.className = "pt-2 pb-1 flex justify-between items-center";
            li.innerHTML = `<div><strong class="text-bordo">Vídeos com IA + CapCut (${minutosIa} min)</strong><br><span class="text-xs text-bordo font-bold">Custo de créditos de IA e edição (R$ 80/min).</span></div><div class="flex items-center gap-3"><span class="font-black text-bordo text-sm sm:text-base shrink-0">R$ ${precoIa.toFixed(2).replace('.', ',')}</span><button type="button" onclick="removerItemCarrinho('Vídeos com IA + CapCut')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-100 px-2 py-1 rounded-lg">Remover</button></div>`;
            resumoUl.appendChild(li);
        }

        // Edição Geral por Minuto
        const checkVideoGeral = document.getElementById('check-video-geral');
        if(checkVideoGeral.checked) {
            const minutos = parseInt(document.getElementById('input-minutos-geral').value) || 1;
            const precoVideo = minutos * 40;
            total += precoVideo;
            selecionados++;

            const li = document.createElement('li');
            li.className = "pt-2 pb-1 flex justify-between items-center";
            li.innerHTML = `<div><strong class="text-bordo">Edição Geral de Vídeos (${minutos} min)</strong><br><span class="text-xs text-bordo font-bold">Edição profissional no CapCut (R$ 40/min).</span></div><div class="flex items-center gap-3"><span class="font-black text-bordo text-sm sm:text-base shrink-0">R$ ${precoVideo.toFixed(2).replace('.', ',')}</span><button type="button" onclick="removerItemCarrinho('Edição Geral de Vídeos')" class="text-red-500 hover:text-red-700 font-bold text-xs bg-red-100 px-2 py-1 rounded-lg">Remover</button></div>`;
            resumoUl.appendChild(li);
        }

        if(selecionados === 0) {
            resumoUl.innerHTML = '<li class="pt-1">Seu carrinho está vazio. Adicione itens acima ou clique nas especialidades.</li>';
        }

        const totalFormatado = 'R$ ' + total.toFixed(2).replace('.', ',');
        document.getElementById('total-valor').innerText = totalFormatado;
        document.getElementById('modal-total-valor').innerText = totalFormatado;
    }

    // Adiciona escuta em todos os checkboxes da calculadora para disparar o Toast ao marcar/desmarcar
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.calc-item').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const nomeServico = this.getAttribute('data-name');
                if (this.checked) {
                    mostrarToast(`"${nomeServico}" adicionado ao carrinho!`, "🛒");
                } else {
                    mostrarToast(`"${nomeServico}" removido do carrinho.`, "🗑️");
                }
            });
        });
    });

    function abrirModalOrcamento() {
        const total = document.getElementById('total-valor').innerText;
        if(total === 'R$ 0,00') {
            mostrarToast('Selecione pelo menos um serviço no carrinho!', '⚠️');
            return;
        }

        const itens = obterItensSelecionadosTexto();
        const resumoDiv = document.getElementById('modal-resumo-itens');
        resumoDiv.innerHTML = '• ' + itens.join('<br>• ');

        document.getElementById('modalOrcamento').classList.remove('hidden');
        document.getElementById('modalOrcamento').classList.add('flex');
        mostrarToast("Abrindo formulário de briefing...", "📋");
    }

    function fecharModalOrcamento() {
        document.getElementById('modalOrcamento').classList.add('hidden');
        document.getElementById('modalOrcamento').classList.remove('flex');
    }

    function enviarDadosPlanilha(e) {
        e.preventDefault();

        const nomeVal = document.getElementById('cliente-nome').value.trim();
        const contatoVal = document.getElementById('cliente-contato').value.trim();
        const logoStatusVal = document.getElementById('cliente-logo-status').value;
        const detalhesPrazosVal = document.getElementById('cliente-detalhes-prazos').value.trim();
        const valorTotalVal = document.getElementById('total-valor').innerText;
        
        const itensArray = obterItensSelecionadosTexto();
        const servicosFormatados = itensArray.length > 0 ? itensArray.join(', ') : "Nenhum selecionado";

        const payload = {
            tipo: "pedido",
            nome: nomeVal,
            contato: contatoVal,
            servicos: servicosFormatados,
            logoStatus: logoStatusVal,
            detalhesPrazos: detalhesPrazosVal,
            valorTotal: valorTotalVal
        };

        if (URL_APPS_SCRIPT) {
            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('Erro ao enviar:', err));
        }

        const textoInstagram = `✨ NOVO BRIEFING & PEDIDO - EVE DESIGN STUDIO ✨\n\n` +
            `👤 Cliente: ${nomeVal}\n` +
            `📱 Contato: ${contatoVal}\n` +
            `🛠️ Serviços Escolhidos: ${servicosFormatados}\n` +
            `🎨 Status do Logo: ${logoStatusVal}\n` +
            `💰 Valor Total Simulado: ${valorTotalVal}\n\n` +
            `📝 Detalhes / Prazos / Minutos:\n"${detalhesPrazosVal}"`;

        navigator.clipboard.writeText(textoInstagram).then(() => {
            mostrarToast("Briefing salvo na planilha & COPIADO! Cole no Direct 📋✨", "📋");
        }).catch(() => {
            mostrarToast("Briefing salvo na planilha! Redirecionando...", "🚀");
        });

        fecharModalOrcamento();

        setTimeout(() => {
            window.open(`https://www.instagram.com/${SEU_INSTAGRAM}/`, '_blank');
        }, 1000);
    }

    function mostrarNivel(nome, nivel, desc) {
        document.getElementById('modal-titulo').innerText = nome;
        document.getElementById('modal-desc').innerText = desc;
        document.getElementById('modal-ferramenta').classList.remove('hidden');
        document.getElementById('modal-ferramenta').classList.add('flex');
        mostrarToast(`Visualizando ferramenta: ${nome}`, "🛠️");
    }

    function fecharModal() {
        document.getElementById('modal-ferramenta').classList.add('hidden');
        document.getElementById('modal-ferramenta').classList.remove('flex');
    }
</script>
