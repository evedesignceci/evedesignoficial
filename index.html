<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve Design | Identidade Visual, IA Criativa & Ecossistemas Digitais</title>
    
    <!-- FAVICON (Logo de Perfil) -->
    <link rel="icon" type="image/png" sizes="64x64" href="https://i.imgur.com/DXgf8v3.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bordo: '#6E1940',
                        rosa: '#F384B2',
                        rosaclaro: '#F0C4D7',
                        amarelo: '#F7C815',
                        creme: '#F7E9D6',
                    },
                    fontFamily: {
                        sans: ['Darker Grotesque', 'Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #F7E9D6; color: #6E1940; font-family: 'Darker Grotesque', sans-serif; font-size: 1.15rem; }
        .bg-pattern { background-image: radial-gradient(#F0C4D7 1.2px, transparent 1.2px); background-size: 24px 24px; }
        .card-feedback { animation: pulse 0.4s ease-in-out; background-color: #F0C4D7 !important; }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col selection:bg-rosa selection:text-bordo">

    <!-- HEADER -->
    <header class="w-full bg-white/95 backdrop-blur-md border-b-2 border-rosaclaro sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#sobre-mim" class="flex items-center gap-3">
                <img src="https://i.imgur.com/DXgf8v3.png" alt="Avatar Evelyn" class="w-12 h-12 rounded-full object-cover border-2 border-rosa">
                <div>
                    <h2 class="font-black text-bordo leading-none">Evelyn Cecilia</h2>
                    <p class="text-xs font-bold text-bordo">Eve Design Studio</p>
                </div>
            </a>
            <a href="https://www.instagram.com/eve.desi_gn/" target="_blank" class="bg-bordo text-creme font-black text-sm py-2 px-4 rounded-xl flex items-center gap-2">
                <img src="https://i.imgur.com/yIbaMKH.png" class="w-4 h-4 invert"> Instagram
            </a>
        </div>
    </header>

    <!-- SOBRE MIM -->
    <section id="sobre-mim" class="w-full max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white/90 border-2 border-rosaclaro rounded-3xl p-8 shadow-lg">
            <h2 class="text-3xl font-black mb-4">Olá, sou a Evelyn Cecilia! 🎨🤖</h2>
            <p class="font-bold mb-6">Desenvolvo ecossistemas digitais com IA e design estratégico.</p>
            
            <h3 class="text-xs font-black uppercase mb-3">Minha Caixa de Ferramentas:</h3>
            <div class="flex flex-wrap gap-3">
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/Q5aIApP.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">AI</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/jQt50UJ.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">Blender</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/9eCY7fO.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">Canva</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/jzEwkZc.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">Gemini</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/hX49tNI.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">Grok</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/SeC0Yhj.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">GPT</span></div>
                <div class="bg-creme border-2 border-rosaclaro p-3 rounded-2xl flex flex-col items-center w-20"><img src="https://i.imgur.com/nqmlhMk.png" class="w-8 h-8 mb-1"> <span class="text-xs font-black">CapCut</span></div>
            </div>
        </div>
    </section>

    <!-- SEÇÃO DE PROJETOS -->
    <section id="exemplos" class="w-full max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-black mb-6">Projetos & Marcas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Exemplo de como usar os ícones de redes -->
            <div class="bg-white p-6 rounded-3xl border-2 border-rosaclaro">
                <h3 class="font-black text-xl">Turminha do Xexéu</h3>
                <div class="flex gap-2 mt-2">
                    <a href="#"><img src="https://i.imgur.com/yIbaMKH.png" class="w-6 h-6"></a>
                    <a href="#"><img src="https://i.imgur.com/rFW5M6l.png" class="w-6 h-6"></a>
                </div>
            </div>
            <!-- ... outros cards seguem o mesmo padrão -->
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-6 font-black text-sm border-t border-rosaclaro/60">
        © Eve Design Studio.
    </footer>

</body>
</html>
